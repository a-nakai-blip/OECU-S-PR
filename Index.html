<!DOCTYPE html><html lang="ja"><head><base target="_top"><meta charset="UTF-8"><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;margin:0;background:#f6f8fb;color:#172033}header{background:#fff;padding:18px 24px;border-bottom:1px solid #ddd}main{max-width:1100px;margin:20px auto;padding:0 16px}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.card{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:16px}label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}input[type=text],textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccd2da;border-radius:7px}textarea{min-height:100px}.btn{padding:9px 13px;border:0;border-radius:7px;font-weight:700;cursor:pointer;margin:8px 5px 0 0}.primary{background:#1f5fae;color:#fff}.secondary{background:#eef4fb;color:#174f91}.tabs button{border:0;background:none;padding:9px;font-weight:700}.panel{display:none}.panel.active{display:block}.notice{padding:10px;background:#f8fafc;border:1px solid #e4e7ec;border-radius:7px;margin:8px 0}.warn{background:#fffaeb}.small{font-size:12px;color:#667085}
</style></head><body><header><b>OECUスポーツ広報投稿支援</b><div class="small">「スポーツでひと、社会を支える！」｜Claude API v0.6</div></header><main><div class="grid">
<section class="card"><h3>素材を入力</h3><div id="user" class="notice"></div><label>イベント名</label><input id="eventName" type="text"><label>日時（不明なら空欄）</label><input id="eventDate" type="text"><label>担当者コメント</label><textarea id="comment"></textarea><label>写真・資料</label><input id="files" type="file" multiple accept="image/*,.pdf,.doc,.docx"><div class="small">画像はClaudeが確認します。PDF等は現版ではAI読解せず、メール添付・Drive保存に利用します。</div><label><input id="searchOfficial" type="checkbox" checked> イベント名から公式情報を検索</label><br><button id="gen" class="btn primary" onclick="generate()">投稿案を作成</button><span id="busy"></span><div id="error" class="notice warn" style="display:none"></div><h4>運用状況</h4><div id="config" class="small"></div></section>
<section class="card"><div class="tabs"><button onclick="tab('summary')">確認</button><button onclick="tab('instagram')">Instagram</button><button onclick="tab('x')">X</button><button onclick="tab('journal')">OECU JOURNAL</button><button onclick="tab('analysis')">分析</button></div>
<div id="summary" class="panel active">素材を入力して投稿案を作成してください。</div>
<div id="instagram" class="panel"><textarea id="igText" style="min-height:260px"></textarea><div id="igTags"></div></div>
<div id="x" class="panel"><textarea id="xText" style="min-height:220px"></textarea><div id="xTags"></div><button class="btn primary" onclick="postX()">Xへ投稿</button></div>
<div id="journal" class="panel"><label>タイトル</label><input id="jTitle" type="text"><label>リード</label><textarea id="jLead"></textarea><label>本文</label><textarea id="jBody" style="min-height:320px"></textarea><button class="btn secondary" onclick="saveDraft()">Driveへ保存</button><button class="btn primary" onclick="sendJournal()">学園広報課へ送信</button><div class="small">送信先：kouhou@osakac.ac.jp</div></div>
<div id="analysis" class="panel"></div></section></div></main><script>
let RESULT=null,FILES=[];
google.script.run.withSuccessHandler(c=>{document.getElementById('user').textContent='ログイン中：'+c.userEmail;document.getElementById('config').innerHTML='Claude API: '+(c.configured.claude?'設定済み':'未設定')+'<br>投稿履歴: '+(c.configured.history?'設定済み':'未設定')+'<br>Drive: '+(c.configured.uploadFolder?'設定済み':'未設定')+'<br>X: '+(c.configured.x?'設定済み':'未設定')}).getClientConfig();
function tab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
async function readFiles(){let out=[];for(const f of [...document.getElementById('files').files]){let data=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(f)});out.push({name:f.name,mimeType:f.type||'application/octet-stream',dataBase64:data})}return out}
async function generate(){busy(true);err('');try{FILES=await readFiles()}catch(e){err(e.message);busy(false);return}let p={eventName:v('eventName'),date:v('eventDate'),comment:v('comment'),searchOfficialInfo:document.getElementById('searchOfficial').checked,files:FILES};google.script.run.withSuccessHandler(r=>{RESULT=r;render(r);busy(false)}).withFailureHandler(e=>{err(e.message||e);busy(false)}).generatePublication(p)}
function render(r){document.getElementById('igText').value=(r.instagram||{}).text||'';document.getElementById('igTags').textContent=((r.instagram||{}).hashtags||[]).join(' ');document.getElementById('xText').value=(r.x||{}).text||'';document.getElementById('xTags').textContent=((r.x||{}).hashtags||[]).join(' ');let j=r.oecu_journal||{};document.getElementById('jTitle').value=j.title||'';document.getElementById('jLead').value=j.lead||'';document.getElementById('jBody').value=j.body||'';let q=(r.confirmation_questions||[]).map(x=>'<div class="notice warn">'+esc(x)+'</div>').join('');let checks=(r.pre_publish_checks||[]).map(x=>'<div class="notice">'+esc(x.message)+'</div>').join('');document.getElementById('summary').innerHTML='<h3>確認事項</h3>'+q+'<h3>公開前チェック</h3>'+checks;let a=r.history_analysis||{};document.getElementById('analysis').innerHTML='<h3>投稿バランス</h3><div class="notice">'+esc(a.summary||'')+'</div><div class="notice">'+esc((a.missing_topics||[]).join(' / '))+'</div>'}
function req(){let r=RESULT||{},j=r.oecu_journal||{};return{eventName:v('eventName'),article:{title:v('jTitle'),lead:v('jLead'),body:v('jBody'),category_candidates:j.category_candidates||[],tags:j.tags||[],related_links:j.related_links||[]},verifiedEventInfo:r.verified_event_info||{},classification:r.classification||{},files:FILES}}
function sendJournal(){if(!RESULT)return alert('先に投稿案を作成してください。');if(!confirm('学園広報課へ送信します。よろしいですか？'))return;google.script.run.withSuccessHandler(x=>alert('送信しました。\n'+x.subject)).withFailureHandler(e=>err(e.message||e)).sendJournalEmail(req())}
function saveDraft(){google.script.run.withSuccessHandler(x=>alert('Driveに保存しました（'+x.length+'件）')).withFailureHandler(e=>err(e.message||e)).saveDraftToDrive(req())}
function postX(){if(!RESULT)return alert('先に投稿案を作成してください。');if(!confirm('Xへ投稿しますか？'))return;google.script.run.withSuccessHandler(()=>alert('投稿しました')).withFailureHandler(e=>err(e.message||e)).postToX({eventName:v('eventName'),text:v('xText'),hashtags:(RESULT.x||{}).hashtags||[],classification:RESULT.classification||{}})}
function v(id){return document.getElementById(id).value.trim()}function busy(x){document.getElementById('gen').disabled=x;document.getElementById('busy').textContent=x?'生成中…':''}function err(x){let e=document.getElementById('error');e.textContent=x;e.style.display=x?'block':'none'}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script></body></html>
